# AI Processor - Development Environment Configuration

ai_processor:
  # Ollama Configuration (Ubuntu GPU PC via Tailscale)
  ollama_host: "100.86.192.95"
  ollama_port: 11434

  # WooCommerce Auto-Import (Development)
  woo_auto_import: false  # Set to true to enable auto-import in dev
  woo_url: "{{ vault_woo_dev_url }}"
  woo_consumer_key: "{{ vault_woo_dev_consumer_key }}"
  woo_consumer_secret: "{{ vault_woo_dev_consumer_secret }}"

  # Image Background Removal (rembg via Ubuntu GPU PC)
  remove_bg: true
  bg_threshold: 230
  rembg_host: "100.86.192.95"
  rembg_port: 7000
  rembg_model: "birefnet-general"
