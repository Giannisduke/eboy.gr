# AI Processor - Production Environment Configuration

ai_processor:
  # Ollama Configuration (use localhost since Ollama runs on same server)
  ollama_host: "127.0.0.1"
  ollama_port: 11434

  # AI Models (same as all/ai_processor.yml)
  ai_model_greek: "ilsp/llama-krikri-8b-instruct:latest"
  ai_model_english: "llama3.1:8b"
  translation_model: "ilsp/llama-krikri-8b-instruct:latest"

  # Processing Configuration
  batch_size: 50
  max_concurrent_images: 5
  image_quality: 85
  image_max_width: 1200
  image_max_height: 1200

  # WooCommerce Auto-Import (Production)
  woo_auto_import: true  # Auto-import enabled in production
  woo_url: "{{ vault_woo_production_url | default('https://simple-city.eboy.gr') }}"
  woo_consumer_key: "{{ vault_woo_production_consumer_key | default('') }}"
  woo_consumer_secret: "{{ vault_woo_production_consumer_secret | default('') }}"
