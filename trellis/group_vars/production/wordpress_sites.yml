# Created by trellis-cli v1.17.0
# Documentation: https://roots.io/trellis/docs/wordpress-sites/

wordpress_sites:
  monk.gr:
    site_hosts:
      - canonical: monk.gr
        redirects:
          - www.monk.gr

      - canonical: monk.simple-city.gr
        redirects:
          - www.monk.simple-city.gr

    nginx_extra_directives: |
      # Block direct access/execution of core PHP files (fixes /wp-includes/*.php -> 500)
      location ~* ^/wp-includes/.*\.php$ {
        deny all;
      }

      # Block direct access to wp-admin includes (should never be requested directly)
      location ~* ^/wp-admin/includes/ {
        deny all;
      }

      # Block PHP execution inside uploads (Bedrock + fallback)
      location ~* ^/app/uploads/.*\.php$ {
        deny all;
      }
      location ~* ^/wp-content/uploads/.*\.php$ {
        deny all;
      }

    local_path: ../site
    branch: local-new-setup
    repo: git@github.com:Giannisduke/eboy.gr.git
    repo_subtree_path: site
    wp_cli_path: web/wp

    multisite:
      enabled: true
      subdomains: true

    ssl:
      enabled: true
      provider: letsencrypt

    cache:
      enabled: true
      duration: 30s
      skip_cache_uri: /wp-admin/|/wp-json/|/xmlrpc.php|wp-.*.php|/feed/|index.php|sitemap(_index)?.xml|/cart/|/checkout/|/my-account/|/wc-api/|/wp-admin/admin-ajax.php
      skip_cache_cookie: comment_author|wordpress_[a-f0-9]+|wp-postpass|wordpress_no_cache|wordpress_logged_in|woocommerce_cart_hash|woocommerce_items_in_cart|wp_woocommerce_session_

    env:
      WP_ENV: production
      MULTISITE: true
      SUBDOMAIN_INSTALL: true
      DOMAIN_CURRENT_SITE: monk.gr
      PATH_CURRENT_SITE: /
      SITE_ID_CURRENT_SITE: 1
      BLOG_ID_CURRENT_SITE: 1
      WP_DEBUG: true
      WP_DEBUG_LOG: true
      WP_DEBUG_DISPLAY: false
      SCRIPT_DEBUG: false