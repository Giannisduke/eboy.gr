env: production
timezone: Europe/Athens

# DB
mysql_root_password: "{{ vault_mysql_root_password }}"

mysql_databases:
  - name: simple_city_production
    encoding: utf8mb4
    collation: utf8mb4_unicode_ci

mysql_users:
  - name: simple_city
    password: "{{ vault_mysql_simple_city_password }}"
    priv: "simple_city_production.*:ALL"

    # --- SoftOne MySQL integration user (Trellis-managed)
mysql_additional_users:
  - name: "softone_user"
    host: "%"                 # καλύτερα βάλε IP του SoftOne όταν είσαι έτοιμος (π.χ. "1.2.3.4")
    password: "{{ vault_softone_mysql_password }}"
    priv: "{{ vault_softone_mysql_priv }}"   # θα το ορίσουμε στο vault
    state: present

