env: production
timezone: Europe/Athens

# DB
mysql_root_password: "{{ vault_mysql_root_password }}"

mysql_databases:
  - name: simple_city_production
    encoding: utf8mb4
    collation: utf8mb4_unicode_ci

mysql_users:
  - name: simple_city
    password: "{{ vault_mysql_simple_city_password }}"
    priv: "simple_city_production.*:ALL"

  # SoftOne integration user (Trellis-managed)
  # Προτείνεται να έχει τα ελάχιστα δικαιώματα που χρειάζεται η γέφυρα.
  # Αν η γέφυρα γράφει στη DB, θα χρειαστεί να επεκτείνουμε τα privileges (θα το κάνουμε όταν δούμε τι ακριβώς χρειάζεται).
  - name: softone_user
    password: "{{ vault_mysql_softone_password }}"
    priv: "simple_city_production.*:SELECT"
    host: "%"