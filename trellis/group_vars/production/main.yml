env: production
timezone: Europe/Athens

# PHP limits
php_memory_limit: "768M"
php_upload_max_filesize: "64M"
php_post_max_size: "64M"

# WordPress memory
wordpress_memory_limit: 512M
wordpress_max_memory_limit: 512M

# PHP-FPM tuning
php_fpm_pm: dynamic
php_fpm_max_children: 24
php_fpm_start_servers: 6
php_fpm_min_spare_servers: 4
php_fpm_max_spare_servers: 12
php_fpm_max_requests: 500

# DB
mysql_root_password: "{{ vault_mysql_root_password }}"

mysql_databases:
  - name: simple-city_gr_production
    encoding: utf8mb4
    collation: utf8mb4_unicode_ci

mysql_users:
  - name: simple_city
    password: "{{ vault_mysql_simple_city_password }}"
    priv: "simple-city_gr_production.*:ALL"

    # --- SoftOne MySQL integration user (Trellis-managed)
mysql_additional_users:
  - name: "softone_user"
    host: "80.107.51.120"                # καλύτερα βάλε IP του SoftOne/Bridge όταν είσαι έτοιμος (π.χ. "1.2.3.4")
    password: "{{ vault_softone_mysql_password }}"
    priv: "{{ vault_softone_mysql_priv }}"   # θα το ορίσουμε στο vault
    state: present

