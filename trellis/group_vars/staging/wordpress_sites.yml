# Created by trellis-cli v1.17.0
# Documentation: https://roots.io/trellis/docs/wordpress-sites/

wordpress_sites:
  eboy.gr:
    site_hosts:
    - canonical: eboy.gr
      redirects:
      - www.eboy.gr
    - canonical: sc-staging.eboy.gr
      redirects:
      - www.sc-staging.eboy.gr
    - canonical: monk.eboy.gr
      redirects:
      - www.monk.eboy.gr
    local_path: ../site
    branch: local-new-setup
    repo: git@github.com:Giannisduke/eboy.gr.git
    repo_subtree_path: site
    wp_cli_path: web/wp
    multisite:
      enabled: true
      subdomains: true
    ssl:
      enabled: true
      provider: letsencrypt
    cache:
      enabled: true
      duration: 30s
      skip_cache_uri: /wp-admin/|/wp-json/|/xmlrpc.php|wp-.*.php|/feed/|index.php|sitemap(_index)?.xml|/cart/|/checkout/|/my-account/|/wc-api/|/wp-admin/admin-ajax.php
      skip_cache_cookie: comment_author|wordpress_[a-f0-9]+|wp-postpass|wordpress_no_cache|wordpress_logged_in|woocommerce_cart_hash|woocommerce_items_in_cart|wp_woocommerce_session_
    shared_paths:
      - web/app/uploads
      - web/app/themes/simple-city/scripts/xml_files
      - web/app/themes/simple-city/scripts/product-ai-processor/logs
    env:
      WP_ENV: staging
      MULTISITE: true
      SUBDOMAIN_INSTALL: true
      DOMAIN_CURRENT_SITE: eboy.gr
      PATH_CURRENT_SITE: /
      SITE_ID_CURRENT_SITE: 1
      BLOG_ID_CURRENT_SITE: 1
      WP_MEMORY_LIMIT: "512M"
      WP_MAX_MEMORY_LIMIT: "1024M"
      OLLAMA_HOST: "100.86.192.95"
      REMBG_HOST: "100.86.192.95"
      BRIA_PORT: "7001"