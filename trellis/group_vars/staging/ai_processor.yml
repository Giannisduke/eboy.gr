# AI Processor - Staging Environment Configuration

ai_processor:
  # Ollama Configuration (Ubuntu GPU PC via Tailscale)
  ollama_host: "100.86.192.95"
  ollama_port: 11434

  # AI Models (same as all/ai_processor.yml)
  ai_model_greek: "ilsp/llama-krikri-8b-instruct:latest"
  ai_model_english: "llama3.1:8b"
  translation_model: "ilsp/llama-krikri-8b-instruct:latest"

  # Processing Configuration
  batch_size: 50
  max_concurrent_images: 5
  image_quality: 85
  image_max_width: 1200
  image_max_height: 1200

  # WooCommerce Auto-Import (Staging)
  woo_auto_import: false  # Set to true to enable auto-import in staging
  woo_url: "{{ vault_woo_staging_url | default('https://staging.simple-city.gr') }}"
  woo_consumer_key: "{{ vault_woo_staging_consumer_key | default('') }}"
  woo_consumer_secret: "{{ vault_woo_staging_consumer_secret | default('') }}"

  # Image Background Removal (rembg via Ubuntu GPU PC)
  remove_bg: true
  bg_threshold: 230
  rembg_host: "100.86.192.95"
  rembg_port: 7000
  rembg_model: "birefnet-general"
