env: staging
timezone: Europe/Athens

# PHP limits
php_memory_limit: "1024M"
php_upload_max_filesize: "128M"
php_post_max_size: "128M"

# WordPress memory
# (frontend πιο χαμηλά, admin/cron/WP-CLI μπορεί να πάει έως 1G)
wordpress_memory_limit: 384M
wordpress_max_memory_limit: 1024M

# PHP-FPM tuning
# (κρίσιμο: μειώνουμε max_children για να μην πνίγει το 8GB VM)
php_fpm_pm: dynamic
php_fpm_max_children: 10
php_fpm_start_servers: 4
php_fpm_min_spare_servers: 2
php_fpm_max_spare_servers: 6
php_fpm_max_requests: 500

# DB
mysql_root_password: "{{ vault_mysql_root_password }}"

mysql_databases:
  - name: eboy_gr_staging
    encoding: utf8mb4
    collation: utf8mb4_unicode_ci

mysql_users:
  - name: simple_city
    password: "{{ vault_mysql_simple_city_password }}"
    priv: "eboy_gr_staging.*:ALL"

# Ollama AI Configuration
ollama_enabled: true
ollama_models:
  - "ilsp/llama-krikri-8b-instruct"  # ~6GB RAM, ILSP Greek language model


