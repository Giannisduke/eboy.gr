# Ollama AI Model Server Configuration
# Ollama runs on the Ubuntu GPU PC (100.86.192.95) — not installed on the server.

ollama_enabled: false
ollama_version: "latest"

# Service configuration
ollama_user: ollama
ollama_group: ollama
ollama_bind_address: "0.0.0.0"
ollama_port: 11434

# Installation paths
ollama_install_dir: "/usr/local/bin"
ollama_data_dir: "/var/lib/ollama"
ollama_log_dir: "/var/log/ollama"

# AI Models to download during provision
# These will be pulled automatically when Ollama is installed
ollama_models:
  # Greek language model for Greek XML processing
  - "ilsp/llama-krikri-8b-instruct:latest"

  # English language model for English XML processing
  - "llama3.1:8b"

  # Fallback model (smaller, faster)
  # - "mistral:7b-instruct-q4_K_M"

# Performance tuning (optional)
# ollama_num_threads: 8
# ollama_num_gpu: 1

# Advanced configuration
ollama_download_url: ""  # Auto-detected based on architecture
