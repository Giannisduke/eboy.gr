apt_cache_valid_time: 3600
apt_package_state: present
apt_security_package_state: latest
apt_dev_package_state: latest
apt_clean_sources: false

composer_keep_updated: true

php_version: "8.3"
php_max_input_vars: 5000
php_extensions_custom:
  php8.3-soap: "{{ apt_package_state }}"

ntp_timezone: Etc/UTC
ntp_manage_config: true

www_root: /srv/www
max_journal_size: 512M

# -----------------------
# Netdata
# -----------------------
netdata_enabled: true
netdata_install_method: "official_script"
netdata_channel: "stable"

# --- Nginx stub_status (local only) ---
netdata_nginx_stub_status_enabled: true
netdata_nginx_stub_status_path: "/stub_status"
netdata_nginx_stub_status_host: "127.0.0.1"
netdata_nginx_stub_status_port: 81   # προτείνεται να ΜΗΝ είναι 80

# --- MySQL collector user (local socket) ---
netdata_mysql_enabled: true
netdata_mysql_user: "netdata"
netdata_mysql_password: "{{ vault_netdata_mysql_password }}"
netdata_mysql_socket: "/var/run/mysqld/mysqld.sock"
netdata_mysql_host: "localhost"   # για grants @localhost

# Values of raw_vars will be wrapped in `{% raw %}` to avoid templating problems if values include `{%` and `{{`.
raw_vars:
  - vault_mail_password
  - vault_mysql_root_password
  - vault_users.*.password
  - vault_users.*.salt
  - vault_wordpress_env_defaults
  - vault_wordpress_sites
  - vault_netdata_mysql_password