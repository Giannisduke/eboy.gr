---
# Build before deploy - Install Composer dependencies

- name: Install Composer dependencies in theme
  command: composer install --no-ansi --no-dev --no-interaction --no-progress --optimize-autoloader --classmap-authoritative
  args:
    chdir: "{{ deploy_helper.new_release_path }}/web/app/themes/simple-city"
  register: composer_result
  changed_when: "'Nothing to install' not in composer_result.stdout"

- name: Display Composer install result
  debug:
    msg: "Composer dependencies installed successfully"
  when: composer_result.changed
