---
- name: Add Nginx APT key
  ansible.builtin.apt_key:
    url: "https://nginx.org/keys/nginx_signing.key"
    state: present

- name: Add Nginx PPA
  ansible.builtin.apt_repository:
    repo: "{{ nginx_ppa }}"
    update_cache: yes
  register: result
  until: result is success
  retries: 3
  delay: 5

- name: Install Nginx
  ansible.builtin.apt:
    name: "{{ nginx_package }}"
    state: "{{ nginx_package_state | default(apt_package_state) }}"
    update_cache: true

- name: Ensure site directories exist
  ansible.builtin.file:
    path: "{{ nginx_path }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - sites-available
    - sites-enabled

# Trellis nginx.conf includes: include includes.d/http/*.conf;
- name: Ensure includes.d directories exist
  ansible.builtin.file:
    path: "{{ nginx_path }}/includes.d/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - http
    - all

- name: Create SSL directory
  ansible.builtin.file:
    mode: "0700"
    path: "{{ nginx_path }}/ssl"
    state: directory

# NOTE: το src στο copy πρέπει να δείχνει σε role files/, όχι templates/.
# Αν έχεις το h5bp στο roles/nginx/files/h5bp/ (όπως στο Trellis), άφησέ το έτσι:
- name: Copy h5bp configs
  copy:
    src: templates/h5bp
    dest: "{{ nginx_path }}"
    mode: '0755'
  notify: reload nginx

- name: Create nginx.conf
  ansible.builtin.template:
    src: "{{ nginx_conf }}"
    dest: "{{ nginx_path }}/nginx.conf"
    mode: "0644"
  notify: reload nginx
  tags: nginx-includes

- name: Disable default server
  ansible.builtin.file:
    path: "{{ nginx_path }}/sites-enabled/default"
    state: absent
  notify: reload nginx

# ✅ Netdata stub_status endpoint (loopback only) - τοποθέτηση στο includes.d/http
- name: Netdata | Install stub_status vhost in includes.d/http
  ansible.builtin.template:
    src: netdata-stub-status.conf.j2
    dest: "{{ nginx_path }}/includes.d/http/netdata-stub-status.conf"
    mode: "0644"
  notify: reload nginx
  when: netdata_enabled | default(false)

- name: Enable Nginx to start on boot
  ansible.builtin.service:
    name: nginx
    enabled: yes
    state: started