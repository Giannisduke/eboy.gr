---
- name: Netdata | Skip if disabled
  ansible.builtin.meta: end_host
  when: not netdata_enabled

- name: Netdata | Install dependencies
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - gnupg
    state: present
    update_cache: yes

- name: Netdata | Install via official kickstart
  ansible.builtin.shell: |
    set -e
    curl -fsSL https://get.netdata.cloud/kickstart.sh | bash -s -- --dont-wait --stable-channel
  args:
    executable: /bin/bash
    creates: /usr/sbin/netdata
  when: netdata_install_method == "official_script"

- name: Netdata | Configure bind address/port
  ansible.builtin.template:
    src: netdata.conf.j2
    dest: /etc/netdata/netdata.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart netdata

- name: Netdata | Ensure service enabled and started
  ansible.builtin.service:
    name: netdata
    state: started
    enabled: yes