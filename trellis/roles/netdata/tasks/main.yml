---
# roles/netdata/tasks/main.yml

- name: Netdata | Skip if disabled
  ansible.builtin.meta: end_host
  when: not (netdata_enabled | default(false) | bool)

- name: Netdata | Install dependencies
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - gnupg
    state: present
    update_cache: true

- name: Netdata | Install via official kickstart
  ansible.builtin.shell: |
    set -e
    if [ "{{ netdata_channel | default('stable') }}" = "nightly" ]; then
      curl -fsSL https://get.netdata.cloud/kickstart.sh | bash -s -- --dont-wait --nightly-channel
    else
      curl -fsSL https://get.netdata.cloud/kickstart.sh | bash -s -- --dont-wait --stable-channel
    fi
  args:
    executable: /bin/bash
    creates: /usr/sbin/netdata
  when: (netdata_install_method | default('official_script')) == "official_script"

- name: Netdata | Ensure config directory exists
  ansible.builtin.file:
    path: /etc/netdata
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Netdata | Configure bind address/port (optional)
  ansible.builtin.template:
    src: netdata.conf.j2
    dest: /etc/netdata/netdata.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart netdata
  when: netdata_manage_config | default(true) | bool

- name: Netdata | Ensure service enabled and started
  ansible.builtin.systemd:
    name: netdata
    state: started
    enabled: true
    daemon_reload: true

- name: Netdata | Nginx stub_status (local 127.0.0.1:81)
  ansible.builtin.template:
    src: nginx-stub-status.conf.j2
    dest: /etc/nginx/conf.d/netdata-stub-status.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx
  when: netdata_nginx_stub_status_enabled | default(true)