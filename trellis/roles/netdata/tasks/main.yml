---
- name: Netdata | Skip if disabled
  ansible.builtin.meta: end_host
  when: not netdata_enabled

- name: Netdata | Install dependencies
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - gnupg
    state: present
    update_cache: yes

- name: Netdata | Install via official kickstart
  ansible.builtin.shell: |
    curl -fsSL https://get.netdata.cloud/kickstart.sh | bash -s -- --dont-wait --stable-channel
  args:
    executable: /bin/bash
    creates: /usr/sbin/netdata
  when: netdata_install_method == "official_script"

# -----------------------
# NGINX stub_status (Option A - includes.d/http)
# -----------------------
- name: Netdata | Ensure nginx includes.d/http exists
  ansible.builtin.file:
    path: /etc/nginx/includes.d/http
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: netdata_nginx_stub_status_enabled | default(false)

- name: Netdata | Install nginx stub_status vhost
  ansible.builtin.template:
    src: netdata-stub-status.conf.j2
    dest: /etc/nginx/includes.d/http/netdata-stub-status.conf
    owner: root
    group: root
    mode: "0644"
  when: netdata_nginx_stub_status_enabled | default(false)
  notify: Reload nginx

# -------------------------------------------------
# Netdata nginx collector config
# -------------------------------------------------
- name: Netdata | Configure go.d nginx collector
  ansible.builtin.template:
    src: netdata/go.d/nginx.conf.j2
    dest: /etc/netdata/go.d/nginx.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart netdata
  when: netdata_nginx_stub_status_enabled | default(true)

# -------------------------------------------------
# MySQL / MariaDB collector
# -------------------------------------------------
- name: Netdata | MySQL/MariaDB | Create netdata user
  community.mysql.mysql_user:
    name: "{{ netdata_mysql_user }}"
    host: "localhost"
    password: "{{ netdata_mysql_password }}"
    priv: "*.*:USAGE,PROCESS,REPLICATION CLIENT,SELECT"
    state: present
    login_unix_socket: "{{ netdata_mysql_socket }}"
    login_user: root
    check_implicit_admin: true
  when: netdata_mysql_enabled | default(true)

- name: Netdata | Configure go.d mysql collector
  ansible.builtin.template:
    src: netdata/go.d/mysql.conf.j2
    dest: /etc/netdata/go.d/mysql.conf
    owner: root
    group: root
    mode: "0640"
  notify: Restart netdata
  when: netdata_mysql_enabled | default(true)

- name: Netdata | Ensure service enabled and started
  ansible.builtin.service:
    name: netdata
    state: started
    enabled: yes

- name: Netdata | Configure go.d mysql collector (socket)
  ansible.builtin.template:
    src: netdata/go.d/mysql.conf.j2
    dest: /etc/netdata/go.d/mysql.conf
    owner: root
    group: root
    mode: "0640"
  notify: Restart netdata
  when: netdata_mysql_enabled | default(true)