---
- name: Netdata | Skip if disabled
  ansible.builtin.meta: end_host
  when: not (netdata_enabled | default(false))

- name: Netdata | Install dependencies
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - gnupg
      - python3-pymysql
    state: present
    update_cache: yes

- name: Netdata | Install via official kickstart
  ansible.builtin.shell: |
    curl -fsSL https://get.netdata.cloud/kickstart.sh | bash -s -- \
      --dont-wait \
      --{{ netdata_channel | default('stable') }}-channel
  args:
    executable: /bin/bash
    creates: /usr/sbin/netdata
  when: (netdata_install_method | default('official_script')) == "official_script"

# -----------------------
# NGINX stub_status (Trellis nginx.conf includes /etc/nginx/includes.d/http/*.conf)
# -----------------------
- name: Netdata | Nginx stub_status | Ensure includes dir exists
  ansible.builtin.file:
    path: /etc/nginx/includes.d/http
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: netdata_nginx_stub_status_enabled | default(false)

- name: Netdata | Nginx stub_status | Install vhost
  ansible.builtin.template:
    src: netdata-stub-status.conf.j2
    dest: /etc/nginx/includes.d/http/netdata-stub-status.conf
    owner: root
    group: root
    mode: "0644"
  when: netdata_nginx_stub_status_enabled | default(false)
  notify: Reload nginx

- name: Netdata | Netdata nginx collector | Configure go.d
  ansible.builtin.template:
    src: go.d/nginx.conf.j2
    dest: /etc/netdata/go.d/nginx.conf
    owner: root
    group: root
    mode: "0644"
  when: netdata_nginx_stub_status_enabled | default(false)
  notify: Restart netdata

# -----------------------
# MySQL / MariaDB collector (local socket)
# -----------------------
- name: Netdata | MySQL/MariaDB | Create netdata user
  community.mysql.mysql_user:
    name: "{{ netdata_mysql_user }}"
    host: "{{ netdata_mysql_host | default('localhost') }}"
    password: "{{ netdata_mysql_password }}"
    state: present
    login_unix_socket: "{{ netdata_mysql_socket }}"
    login_user: root
    check_implicit_admin: true
    priv:
      "*.*": "USAGE,PROCESS,REPLICATION CLIENT"
      "performance_schema.*": "SELECT"
      "information_schema.*": "SELECT"
  when: netdata_mysql_enabled | default(false)

- name: Netdata | Netdata mysql collector | Configure go.d
  ansible.builtin.template:
    src: go.d/mysql.conf.j2
    dest: /etc/netdata/go.d/mysql.conf
    owner: root
    group: root
    mode: "0640"
  when: netdata_mysql_enabled | default(false)
  notify: Restart netdata

# -----------------------
# Service
# -----------------------
- name: Netdata | Ensure service enabled and started
  ansible.builtin.service:
    name: netdata
    state: started
    enabled: yes