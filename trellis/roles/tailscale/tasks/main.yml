---
- name: Download Tailscale GPG keyring
  shell: >
    curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_distribution_release }}.gpg
    | tee /usr/share/keyrings/tailscale-archive-keyring.gpg > /dev/null
  changed_when: false

- name: Remove legacy Tailscale sources file
  file:
    path: /etc/apt/sources.list.d/tailscale.list
    state: absent

- name: Write Tailscale apt sources file
  copy:
    dest: /etc/apt/sources.list.d/tailscale.list
    content: |
      # Tailscale packages for ubuntu {{ ansible_distribution_release }}
      deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu {{ ansible_distribution_release }} main
    mode: '0644'

- name: Install Tailscale
  apt:
    name: tailscale
    state: "{{ apt_package_state }}"
    update_cache: true
    cache_valid_time: "{{ apt_cache_valid_time }}"

- name: Enable and start tailscaled
  service:
    name: tailscaled
    state: started
    enabled: true

- name: Check Tailscale connection status
  command: tailscale status
  register: tailscale_status
  changed_when: false
  failed_when: false

- name: Authenticate Tailscale
  command: >
    tailscale up
    --authkey={{ tailscale_auth_key }}
    --accept-routes={{ tailscale_accept_routes | lower }}
    --hostname={{ tailscale_hostname }}
  when: tailscale_status.rc != 0
  no_log: true
