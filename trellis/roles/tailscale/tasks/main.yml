---
- name: Remove legacy Tailscale apt repository entry
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/tailscale-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu {{ ansible_distribution_release }} main"
    state: absent
    filename: tailscale

- name: Download Tailscale GPG keyring
  get_url:
    url: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_distribution_release }}.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: '0644'
    force: yes

- name: Add Tailscale apt repository
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu {{ ansible_distribution_release }} main"
    state: present
    filename: tailscale

- name: Install Tailscale
  apt:
    name: tailscale
    state: "{{ apt_package_state }}"
    update_cache: true
    cache_valid_time: "{{ apt_cache_valid_time }}"

- name: Enable and start tailscaled
  service:
    name: tailscaled
    state: started
    enabled: true

- name: Check Tailscale connection status
  command: tailscale status
  register: tailscale_status
  changed_when: false
  failed_when: false

- name: Authenticate Tailscale
  command: >
    tailscale up
    --authkey={{ tailscale_auth_key }}
    --accept-routes={{ tailscale_accept_routes | lower }}
    --hostname={{ tailscale_hostname }}
  when: tailscale_status.rc != 0
  no_log: true
