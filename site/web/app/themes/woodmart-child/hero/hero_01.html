<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero 01</title>
  <link rel="stylesheet" href="../css/easter_26_04.css">

</head>
<body>

<div class="featured_wrapper">
  <div id="monk_slider" class="monk_slider">
		  			<div class="winter_sales_26">
						<img
							src="images/spring_26_main.png"
							alt=""
						/>
					</div>


  </div><!-- /#monk_slider -->
</div><!-- /.featured_wrapper -->

<script src="https://unpkg.com/embla-carousel@8/embla-carousel.umd.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var viewport = document.querySelector('.embla__viewport');
    if (!viewport) return;

    var embla = EmblaCarousel(viewport, { loop: true });

    var prevBtn = document.querySelector('.embla__prev');
    var nextBtn = document.querySelector('.embla__next');
    if (prevBtn) prevBtn.addEventListener('click', function () { embla.scrollPrev(); });
    if (nextBtn) nextBtn.addEventListener('click', function () { embla.scrollNext(); });

    var dotsEl = document.querySelector('.embla__dots');
    if (dotsEl) {
      embla.slideNodes().forEach(function (_, i) {
        var dot = document.createElement('button');
        dot.className = 'embla__dot' + (i === 0 ? ' embla__dot--selected' : '');
        dot.setAttribute('type', 'button');
        dot.setAttribute('aria-label', 'Slide ' + (i + 1));
        dot.addEventListener('click', function () { embla.scrollTo(i); });
        dotsEl.appendChild(dot);
      });

      embla.on('select', function () {
        var selected = embla.selectedScrollSnap();
        dotsEl.querySelectorAll('.embla__dot').forEach(function (d, i) {
          d.classList.toggle('embla__dot--selected', i === selected);
        });
      });
    }
  });
</script>

</body>
</html>
