# AI Prompts for Product Processing
# These prompts are used by the Ollama API to process product data

title_optimization: |
  Δημιούργησε έναν σύντομο τίτλο προϊόντος ακολουθώντας ΑΚΡΙΒΩΣ αυτούς τους κανόνες:

  ΚΑΝΟΝΕΣ (υποχρεωτικοί):
  1. Μέγιστο 2-3 λέξεις
  2. Δομή: [Τύπος Προϊόντος] [Model Name]
  3. Να μην περιέχει ποτέ χρώμα.

  ΤΙ ΝΑ ΚΡΑΤΗΣΕΙΣ:
  - Τύπος προϊόντος (π.χ. Παπουτσοθήκη, Κρεβάτι, Τραπέζι) - ΜΟΝΟ μία λέξη
  - Model name (π.χ. Holdon, Nevil, Remus) - με κεφαλαίο πρώτο γράμμα

  ΔΙΑΓΡΑΦΕ ΑΜΕΣΩΣ αυτές τις λέξεις αν εμφανίζονται:
  - Brands: pakoworld, libertab2b, liberta, b2bmarkt, estiahomeart (και παραλλαγές με διαφορετικά κεφαλαία)
  - Χρώματα: μαύρο, λευκό, καρυδί, wenge, sonoma, oak, γκρι, μπεζ, καφέ, ματ, γυαλιστερό
  - Υλικά: PU, MDF, μελαμίνη, ξύλο, αλουμίνιο, μέταλλο, ύφασμα, δερμάτινο
  - Διαστάσεις: αριθμοί με X/x/× και cm/εκ/ΕΚ (π.χ. 160x200εκ, 80X45X40ΕΚ)
  - Λέξεις: χρώμα, χρώματος, υλικό, από, ματ, Έπιπλο, Εισόδου, Χωλ
  - Αριθμοί ζευγών/θέσεων/τεμαχίων: "12 Ζεύγων", "3 Θέσεων"

  ΠΑΡΑΔΕΙΓΜΑΤΑ:

  ❌ "Κρεβάτι OLYMPUS pakoworld χρώμα wenge 160x200εκ" → ✅ "Κρεβάτι Olympus"
  ❌ "Έπιπλο Εισόδου Παπουτσοθήκη HOLDON 12 Ζεύγων Pakoworld" → ✅ "Παπουτσοθήκη Holdon"
  ❌ "Τραπέζι Σαλονιού REMUS Pakoworld MDF 80X45X40ΕΚ" → ✅ "Τραπέζι Σαλονιού Remus"
  ❌ "Γωνιακός Καναπές LAZIO 3 Θέσεων Με Δεξιά Γωνία Καφέ" → ✅ "Καναπές Lazio"
  ❌ "Συρταριέρα JOSUANE Pakoworld Sonoma Oak 80X40X90ΕΚ" → ✅ "Συρταριέρα Josuane"

  Τίτλος για βελτιστοποίηση: {original_title}

  ΑΠΑΝΤΗΣΗ (ΜΟΝΟ ο τίτλος, τίποτα άλλο):

description_enhancement: |
  Γράψε περιγραφή προϊόντος 100-150 λέξεων σε HTML format.

  Προϊόν: {title}
  Κατηγορία: {supplier_category}
  Υλικά: {material}
  Χαρακτηριστικά: {features}
  Πρωτότυπη περιγραφή: {original_description}

  Κανόνες:
  - ΜΟΝΟ εισαγωγικό κείμενο μάρκετινγκ
  - ΟΧΙ τεχνικά χαρακτηριστικά, ΟΧΙ bullet points, ΟΧΙ <ul>
  - Τόνισε οφέλη χρήσης, αισθητική και ποιότητα
  - Στυλ: Πειστικό, φιλικό, SEO-friendly (ελληνικά)
  - Δομή: 1-2 παράγραφοι <p>...</p>

  Απάντηση (ΜΟΝΟ HTML, χωρίς markdown ή επεξηγήσεις):

tag_generation: |
  Επίλεξε ΕΝΑ tag από τη λίστα που ταιριάζει στο προϊόν.
  Απάντησε με ΜΟΝΟ αυτή τη λέξη, τίποτα άλλο.

  ΕΓΚΥΡΑ TAGS:
  καναπές, πολυθρόνα, τραπέζι, καρέκλα, σκαμπό, πουφ, κρεβάτι,
  ντουλάπα, βιβλιοθήκη, γραφείο, συρταριέρα, κομοδίνο,
  κονσόλα, μπουφές, βιτρίνα, ραφιέρα, παπουτσοθήκη,
  κρεμάστρα, καλόγερος, σομιέ, στρώμα, μαξιλάρι,
  φωτιστικό, καθρέφτης, πίνακας, διακοσμητικό, βάζο, ξαπλώστρα,
  σεζλόνγκ, ομπρέλα, αιώρα, καλάθι, έπιπλο τηλεόρασης

  Παραδείγματα:
  Παπουτσοθήκη HOLDON 12 ζεύγων → παπουτσοθήκη
  Τραπέζι σαλονιού REMUS → τραπέζι
  Κρεβάτι Nevil 160x200 → κρεβάτι
  Γωνιακός Καναπές LAZIO → καναπές
  Καρέκλα Γραφείου ELMO → καρέκλα
  Βοηθητικό Τραπέζι SIRO → τραπέζι
  Πίνακας Ζωγραφικής VENICE → πίνακας
  Καδράκι τοίχου ARTIS → πίνακας

  {title} →

tech_specs: |
  Δημιούργησε λίστα τεχνικών χαρακτηριστικών για το παρακάτω προϊόν.

  Προϊόν: {title}
  Κατηγορία: {supplier_category}
  Υλικά: {material}
  Διαστάσεις: {dimensions}
  Χαρακτηριστικά: {attributes}
  Περιγραφή προμηθευτή: {original_description}

  Κανόνες:
  - Γράψε 4-7 τεχνικά χαρακτηριστικά
  - Κάθε χαρακτηριστικό: 1 σύντομη, σαφής πρόταση
  - Συμπερίλαβε: υλικά κατασκευής, ποιότητα, λειτουργικά χαρακτηριστικά, επιφάνεια/φινίρισμα
  - ΜΗΝ συμπεριλάβεις διαστάσεις (υπάρχουν σε άλλο tab)
  - Ελληνικά, τεχνικό και αντικειμενικό ύφος

  Απάντηση (ΜΟΝΟ <ul><li>...</li></ul>, χωρίς τίτλο ή άλλο κείμενο):

category_mapping: |
  Αντιστοίχισε την κατηγορία του προμηθευτή σε ΜΙΑ από τις 9 κατηγορίες WooCommerce:

  Κατηγορία προμηθευτή: {supplier_category}
  Όνομα προϊόντος: {product_name}

  Διαθέσιμες κατηγορίες WooCommerce:
  1. Καθιστικό - Καναπέδες, πολυθρόνες, καρέκλες σαλονιού, σκαμπό, πουφ
  2. Υπνοδωμάτιο - Κρεβάτια, ντουλάπες, συρταριέρες, κομοδίνα, σομιέ
  3. Τραπεζαρία - Τραπέζια φαγητού, καρέκλες τραπεζαρίας, μπουφέδες, βιτρίνες
  4. Σαλόνι & Βοηθητικά - Coffee tables, βιβλιοθήκες, έπιπλα τηλεόρασης, κονσόλες, γραφεία
  5. Αποθήκευση & Οργάνωση - Παπουτσοθήκες, μπαούλα, ραφιέρες, κουτιά, καλάθια
  6. Διακόσμηση - Πίνακες, βάζα, καθρέφτες, κεριά, διακοσμητικά αντικείμενα
  7. Κήπος & Εξωτερικός Χώρος - Έπιπλα κήπου, σετ βεράντας, ξαπλώστρες, ομπρέλες
  8. Μπάνιο - Έπιπλα και αξεσουάρ μπάνιου
  9. Κουζίνα - Σκεύη, εξοπλισμός και έπιπλα κουζίνας (πιάτα, ποτήρια, μαχαιροπίρουνα, μαγειρικά, ψυγεία)

  Οδηγίες:
  - Ανάλυσε την πλήρη ιεραρχία της κατηγορίας προμηθευτή και το όνομα του προϊόντος
  - Επίλεξε την πιο κατάλληλη κατηγορία
  - Καναπέδες, πολυθρόνες, σκαμπό → "Καθιστικό"
  - Κρεβάτια, ντουλάπες, κομοδίνα → "Υπνοδωμάτιο"
  - Τραπέζια φαγητού, καρέκλες τραπεζαρίας, μπουφέδες → "Τραπεζαρία"
  - Coffee tables, βιβλιοθήκες, έπιπλα TV, γραφεία → "Σαλόνι & Βοηθητικά"
  - Παπουτσοθήκες, μπαούλα, αποθήκευση → "Αποθήκευση & Οργάνωση"
  - Πίνακες, βάζα, διακοσμητικά → "Διακόσμηση"
  - Εξωτερικός χώρος, κήπος, βεράντα → "Κήπος & Εξωτερικός Χώρος"
  - Είδη μπάνιου → "Μπάνιο"
  - Σκεύη, εξοπλισμός ή έπιπλα κουζίνας → "Κουζίνα"

  Απάντησε με ΜΟΝΟ το όνομα της κατηγορίας (π.χ. "Καθιστικό"), χωρίς άλλο κείμενο ή εξηγήσεις.

category_mapping_with_confidence: |
  Αντιστοίχισε την κατηγορία του προμηθευτή σε ΜΙΑ από τις 8 κατηγορίες WooCommerce και δώσε βαθμό εμπιστοσύνης.

  Κατηγορία προμηθευτή: {supplier_category}
  Όνομα προϊόντος: {product_name}

  Διαθέσιμες κατηγορίες: Καθιστικό, Υπνοδωμάτιο, Τραπεζαρία, Σαλόνι & Βοηθητικά, Αποθήκευση & Οργάνωση, Διακόσμηση, Κήπος & Εξωτερικός Χώρος, Μπάνιο, Κουζίνα

  Απάντησε με JSON format:
  {{
    "category": "όνομα κατηγορίας",
    "confidence": 0.XX (από 0.00 έως 1.00),
    "subcategories": ["υποκατηγορία 1", "υποκατηγορία 2"],
    "reasoning": "σύντομη εξήγηση (1 πρόταση)"
  }}

  Παράδειγμα:
  {{
    "category": "Έπιπλο",
    "confidence": 0.95,
    "subcategories": ["χωλ", "παπουτσοθήκη", "οργάνωση"],
    "reasoning": "Είναι παπουτσοθήκη για χώρο εισόδου"
  }}
