# AI Prompts for Product Processing
# These prompts are used by the Ollama API to process product data

title_optimization: |
  Είσαι expert στη βελτιστοποίηση τίτλων προϊόντων για e-commerce.

  ΣΗΜΑΝΤΙΚΟ:
  - Γράψε τον τίτλο ΜΟΝΟ με ελληνικά γράμματα (όχι λατινικά, όχι transliteration)
  - Χρησιμοποίησε ΠΕΖΟΚΕΦΑΛΑΙΑ (Title Case): Κεφαλαίο το πρώτο γράμμα κάθε λέξης
  - ΟΧΙ όλα κεφαλαία (UPPERCASE)

  Ο τίτλος πρέπει να είναι:
  - Μέγιστο 60 χαρακτήρες
  - Να περιέχει το brand name (κράτα το όπως είναι: Pakoworld, SANTE, κτλ)
  - Να περιέχει το κύριο χαρακτηριστικό του προϊόντος
  - Χωρίς διαστάσεις ή τεχνικά details (αφαίρεσε cm, εκ, mm, x)
  - SEO-friendly
  - ΠΕΖΟΚΕΦΑΛΑΙΑ: Κάθε λέξη ξεκινά με κεφαλαίο

  Παραδείγματα ΣΩΣΤΗΣ μορφοποίησης:

  Είσοδος: "Παπουτσοθήκη-ντουλάπι SANTE pakoworld 20 ζεύγων χρώμα sonoma 80x37x123εκ"
  Έξοδος: "Παπουτσοθήκη SANTE Pakoworld 20 Ζεύγων Sonoma"

  Είσοδος: "Τραπέζι σαλονιού REMUS pakoworld MDF χρώμα λευκό-sonoma 110x55x35εκ"
  Έξοδος: "Τραπέζι Σαλονιού REMUS Pakoworld Λευκό Sonoma"

  Είσοδος: "Κρεβάτι Nevil pakoworld 150x200 PU χρώμα μαύρο ματ"
  Έξοδος: "Κρεβάτι Nevil Pakoworld 150x200 Μαύρο Ματ"

  ΛΑΘΟΣ παραδείγματα (ΜΗΝ το κάνεις έτσι):
  ❌ "ΠΑΠΟΥΤΣΟΘΗΚΗ SANTE PAKOWORLD" (όλα κεφαλαία - ΛΑΘΟΣ)
  ❌ "παπουτσοθήκη sante pakoworld" (όλα πεζά - ΛΑΘΟΣ)
  ✅ "Παπουτσοθήκη SANTE Pakoworld" (πεζοκεφάλαια - ΣΩΣΤΟ)

  Τίτλος για βελτιστοποίηση: {original_title}

  Απάντηση (ΜΟΝΟ ο τίτλος με πεζοκεφάλαια, χωρίς εξηγήσεις):

description_enhancement: |
  Γράψε περιγραφή προϊόντος 200-280 λέξεων (HTML format).

  Προϊόν: {title}
  Κατηγορία: {supplier_category}
  Χαρακτηριστικά: {features}

  Δομή HTML:
  - <p>Εισαγωγή (2 προτάσεις)</p>
  - <ul><li>4-5 bullets με χαρακτηριστικά</li></ul>
  - <p>Τεχνικές λεπτομέρειες</p>

  Στυλ: Πειστικό, SEO-friendly, τονίζει οφέλη (στα ελληνικά).

  Απάντηση (ΜΟΝΟ HTML):

tag_generation: |
  Δημιούργησε 3-4 tags για το προϊόν (lowercase, ελληνικά).

  Προϊόν: {title}
  Κατηγορία: {supplier_category}
  Χαρακτηριστικά: {attributes}

  Tags να περιλάβεις:
  - Τύπος (π.χ. παπουτσοθήκη, τραπέζι)
  - Χώρος (π.χ. σαλόνι, κήπος, χωλ)
  - Υλικό (π.χ. ξύλο, μέταλλο)
  - Χρώμα (κράτα αγγλικά ονόματα: sonoma, oak, wenge)
  - Στυλ (π.χ. μοντέρνο, κλασικό)
  - Λειτουργία (π.χ. αποθήκευση, οργάνωση)

  Απάντηση (ΜΟΝΟ tags, comma-separated):

category_mapping: |
  Αντιστοίχισε την κατηγορία του προμηθευτή σε ΜΙΑ από τις 9 κατηγορίες WooCommerce:

  Κατηγορία προμηθευτή: {supplier_category}
  Όνομα προϊόντος: {product_name}

  Διαθέσιμες κατηγορίες WooCommerce:
  1. Έπιπλο - Έπιπλα για όλους τους χώρους (σαλόνι, υπνοδωμάτιο, χωλ, τραπεζαρία, κρεβάτια, ντουλάπες, τραπέζια, καρέκλες)
  2. Γραφείο - Έπιπλα και αξεσουάρ γραφείου (γραφεία, καρέκλες γραφείου, βιβλιοθήκες γραφείου)
  3. Κήπος - Έπιπλα και αξεσουάρ εξωτερικού χώρου (έπιπλα κήπου, μπαλκόνι, βεράντα)
  4. Διακόσμηση - Διακοσμητικά είδη (κάδρα, βάζα, ρολόγια, καθρέφτες, ραφιέρες τοίχου)
  5. Λευκά είδη - Κλινοσκεπάσματα, πετσέτες, κουρτίνες (σεντόνια, παπλώματα, στόρια)
  6. Οργάνωση σπιτιού - Λύσεις αποθήκευσης (καλάθια, κουτιά, ράφια οργάνωσης)
  7. Κουζίνα - Σκεύη και εξοπλισμός κουζίνας (πιάτα, ποτήρια, μαχαιροπίρουνα, μαγειρικά)
  8. Μπάνιο - Έπιπλα και αξεσουάρ μπάνιου
  9. Φωτισμός - Φωτιστικά εσωτερικού και εξωτερικού χώρου (λάμπες, φωτιστικά οροφής/τοίχου/δαπέδου)

  Οδηγίες:
  - Ανάλυσε την πλήρη ιεραρχία της κατηγορίας προμηθευτή
  - Επίλεξε την πιο κατάλληλη κατηγορία με βάση το προϊόν
  - Αν είναι έπιπλο (τραπέζι, καρέκλα, ντουλάπα, κρεβάτι, παπουτσοθήκη), επίλεξε "Έπιπλο" (εκτός αν είναι για κήπο ή γραφείο)
  - Αν είναι για εξωτερικό χώρο/κήπο, επίλεξε "Κήπος"
  - Αν είναι γραφείο ή καρέκλα γραφείου, επίλεξε "Γραφείο"
  - Αν υπάρχει αμφιβολία, προτίμησε την πιο γενική κατηγορία

  Απάντησε με ΜΟΝΟ το όνομα της κατηγορίας (π.χ. "Έπιπλο"), χωρίς άλλο κείμενο ή εξηγήσεις.

category_mapping_with_confidence: |
  Αντιστοίχισε την κατηγορία του προμηθευτή σε ΜΙΑ από τις 9 κατηγορίες WooCommerce και δώσε βαθμό εμπιστοσύνης.

  Κατηγορία προμηθευτή: {supplier_category}
  Όνομα προϊόντος: {product_name}

  Διαθέσιμες κατηγορίες: Έπιπλο, Γραφείο, Κήπος, Διακόσμηση, Λευκά είδη, Οργάνωση σπιτιού, Κουζίνα, Μπάνιο, Φωτισμός

  Απάντησε με JSON format:
  {{
    "category": "όνομα κατηγορίας",
    "confidence": 0.XX (από 0.00 έως 1.00),
    "subcategories": ["υποκατηγορία 1", "υποκατηγορία 2"],
    "reasoning": "σύντομη εξήγηση (1 πρόταση)"
  }}

  Παράδειγμα:
  {{
    "category": "Έπιπλο",
    "confidence": 0.95,
    "subcategories": ["χωλ", "παπουτσοθήκη", "οργάνωση"],
    "reasoning": "Είναι παπουτσοθήκη για χώρο εισόδου"
  }}
